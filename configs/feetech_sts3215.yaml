# Feetech STS3215 寄存器表
#
# 来源：LeRobot  src/lerobot/motors/feetech/tables.py
#       (STS_SMS_SERIES_CONTROL_TABLE / MODEL_* 表)
#       数据名: (地址, 字节数)
#
# ⚠️ 不要凭记忆改这张表。写错寄存器地址可能损坏舵机。
#    如需修改，请回到上游 tables.py 核对。

model:
  model_string: sts3215
  model_number: 777
  protocol: 0
  resolution: 4096          # 一圈 4096 计数
  center: 2047              # 中位
  baudrate: 1000000
  baudrate_index: 0         # STS_SMS_SERIES_BAUDRATE_TABLE[1_000_000] = 0

# 本项目只写这几个寄存器，其余一律不碰
registers:
  # --- 我们会写的 ---
  Torque_Enable:    [40, 1]
  Goal_Position:    [42, 2]
  # --- 我们会读的 ---
  Present_Position: [56, 2]
  Present_Velocity: [58, 2]
  Present_Load:     [60, 2]
  Present_Voltage:  [62, 1]
  Present_Temperature: [63, 1]
  Present_Current:  [69, 2]
  Moving:           [66, 1]

# 仅作参考，本项目不写入 EPROM
registers_readonly_reference:
  ID:               [5, 1]
  Baud_Rate:        [6, 1]
  Min_Position_Limit: [9, 2]
  Max_Position_Limit: [11, 2]
  Homing_Offset:    [31, 2]
  Acceleration:     [41, 1]
  Goal_Velocity:    [46, 2]
  Torque_Limit:     [48, 2]
  Lock:             [55, 1]
  Status:           [65, 1]

# 符号-幅值编码位（STS/SMS 系列）
# 解码：若 bit 置位，则为负值，幅值取低 sign_bit 位
# 编码：负值 -> (1 << sign_bit) | (-value)
# 注意：位置类寄存器取值范围 0..4095 落在 15 位内，编解码对非负值是恒等的。
encoding_bits:
  Present_Load: 10
  Homing_Offset: 11
  Goal_Position: 15
  Goal_Velocity: 15
  Present_Position: 15
  Present_Velocity: 15

# 协议常量（Feetech STS/SMS，protocol 0）
protocol_constants:
  header: [0xFF, 0xFF]
  instruction:
    PING: 1
    READ: 2
    WRITE: 3
    REG_WRITE: 4
    ACTION: 5
    SYNC_READ: 0x82
    SYNC_WRITE: 0x83
    RESET: 6
  # 请求包长度字段 = 参数个数 + 2
  # 应答包长度字段 = 参数个数 + 2
  # 校验和 = (~(ID + LENGTH + INSTRUCTION + sum(params))) & 0xFF
