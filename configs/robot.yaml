# rkrobot 运行配置
#
# ⚠️ 坐标系约定（很容易搞错）
#   LeRobot 的 SO 系列机械臂用 RANGE_M100_100 归一化：
#   `robot.get_observation()["<motor>.pos"]` 与 `robot.send_action({...})`
#   的取值范围都是 **[-100, 100]**（由标定文件把实际行程映射过来），
#   既不是舵机原始计数(0-4095)，也不是原始角度。
#   本文件里所有与动作相关的限值都用这个单位。

robot:
  type: so101_follower        # LeRobot 的机器人注册名
  port: /dev/ttyACM0
  # 标定文件名的一部分，必须与 lerobot-calibrate --robot.id 一致
  id: my_follower

  # 关节顺序 = 模型输出的 action 维度顺序，必须与训练数据集一致
  joints:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper

  # LeRobot 自带的安全限速：单次目标相对当前位置的最大跳变（同 [-100,100] 单位）。
  # 这是最主要的安全机制，建议一开始设小一点（如 5），确认动作方向对之后再放大。
  # 设为 null 关闭（不推荐）。
  max_relative_target: 5.0

  # 额外的绝对限位（同单位，[-100,100]）。null 表示只用标定行程与 max_relative_target。
  # 想把某个关节钉死更窄的范围时再填，例如让夹爪不要撞到底。
  action_limits: null
  # action_limits:
  #   shoulder_pan:  [-60, 60]
  #   gripper:       [-80, 40]

  # 与 LeRobot 的动作空间保持一致（默认 true，改动会影响与数据集的兼容性）
  use_degrees: true

camera:
  # 图像槽位名必须与训练时数据集里的相机键一致：
  #   数据集键 observation.images.<slot>  ->  这里写 <slot>
  # 只用一个相机就写一个；多相机加多行。
  slots: [front]

  # opencv 的 index_or_path。D435i 用 V4L2 直读时形如 /dev/video4；
  # ⚠️ 不要用会变的编号，建议用 udev 固定路径。
  index_or_path: 0
  width: 640
  height: 480
  fps: 30
  # 1080p 下建议 MJPG；640x480 一般不必填（null = 自动）
  fourcc: null

policy:
  type: act
  chunk_size: 100          # ACT 一次输出的动作步数（LeRobot 默认 100）
  action_dim: 6            # SO-ARM101 = 5 关节 + 夹爪
  state_dim: 6
  dataset_fps: 30          # 采集时的 fps —— 决定一个动作块覆盖多少秒
  image_slots: [front]     # 必须与 manifests 的 image_slots 一致

  # 图像预处理
  # ⚠️ 必须与 LeRobot 的预处理逐元素核对。注意 LeRobot 的相机默认输出 **RGB**，
  #    所以板端不要再做 BGR->RGB 转换。
  #    pad 模式的补零锚点：top_left = 内容靠右下（与 IB_Robot 实测记录一致）
  image_pad_anchor: top_left

  # 归一化统计量目录（由 pc/convert/export_norm_stats.py 生成）
  # ACT 的 VISUAL / STATE / ACTION 三路都是 MEAN_STD，图像也要用数据集统计量做 z-score，
  # 只做 /255 是错的。
  norm_stats_dir: models/norm_stats

  # RKNN 模型与转换时自动确认的输入顺序
  rknn_model: models/act_pen_place.rknn
  manifest: models/act_pen_place.rknn.manifest.json

runtime:
  # 舵机更新频率，一般等于 camera.fps
  control_freq_hz: 30

  # 动作块超过该时长视为陈旧，丢弃不执行
  max_chunk_age_s: 3.0

  # 数据集 fps 与 control_freq_hz 不同时做线性插值
  interpolate: true

  # 跨块平滑步数：新块生效时从上一块末值线性过渡这么多步。
  # RTC 需要 autograd、静态 RKNN 图无法表达，这里用便宜的线性过渡顶上。0 = 关闭。
  blend_steps: 0

  # 队列空时：hold = 保持上一步（并计数）；error = 立即停机
  on_queue_empty: hold

  # 单次推理输出超过该比例全零即判定异常（防静默失效）
  zero_ratio_error: 0.98

logging:
  level: INFO
  jsonl: logs/run.jsonl      # 每秒一行：目标位置、队列长度、饥饿计数、延迟分位
